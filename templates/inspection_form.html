{% extends 'base.html' %}{% block content %}<div class="heading"><h1>{{'编辑' if item else '新建'}}检验单</h1></div><form method="post" class="card formgrid" id="inspection-form"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>订单号 *<input name="order_no" required value="{{item.order_no if item else ''}}"></label><label>产品名称 *<input name="product" required value="{{item.product if item else ''}}"></label><label>SKU<input name="sku" value="{{item.sku if item else ''}}"></label><label>工厂名称<input name="factory" value="{{item.factory if item else ''}}"></label><label>批量数 *<input id="lot_size" type="number" min="2" name="lot_size" required value="{{item.lot_size if item else ''}}"></label><label>检验水平<select id="level" name="level">{% for v in LEVELS %}<option {{'selected' if (item.level if item else 'II')==v}}>{{v}}</option>{% endfor %}</select></label>{% for key,label,default in [('aql_cri','CRI 严重 AQL','0.010'),('aql_maj','MAJ 主要 AQL','1.5'),('aql_min','MIN 次要 AQL','4.0')] %}<label>{{label}}<select id="{{key}}" name="{{key}}">{% for v in AQL_VALUES %}<option value="{{v}}" {{'selected' if (item|attr(key) if item else default)==v}}>{{v}}</option>{% endfor %}</select></label>{% endfor %}<label>检验日期<input type="date" name="inspect_date" required value="{{item.inspect_date.isoformat() if item else today}}"></label><label>检验员<input name="inspector" value="{{item.inspector if item else me.username}}"></label><section class="preview"><h3>抽样方案预览</h3><div id="plan">填写批量数后自动计算</div></section><div class="actions"><button class="primary">保存检验单</button><a class="button ghost" href="{{url_for('inspection_detail',iid=item.id) if item else url_for('index')}}">取消</a></div></form><script>const ids=['lot_size','level','aql_cri','aql_maj','aql_min'];async function calc(){let p=new URLSearchParams();ids.forEach(x=>p.set(x,document.getElementById(x).value));if(!p.get('lot_size'))return;let r=await fetch('/api/plan?'+p);let d=await r.json();document.getElementById('plan').innerHTML=d.error?d.error:`<b>字码 ${d.code_letter} · 抽样 ${d.sample_size}</b><br>CRI ${d.criteria.cri.ac}/${d.criteria.cri.re}　MAJ ${d.criteria.maj.ac}/${d.criteria.maj.re}　MIN ${d.criteria.min.ac}/${d.criteria.min.re}`;}ids.forEach(x=>document.getElementById(x).addEventListener('change',calc));calc();</script>{% endblock %}
