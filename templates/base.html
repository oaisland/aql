<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}AQL 检测系统{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><header><a class="brand" href="{{url_for('index')}}">AQL · 质量检验</a>{% if me %}<nav><a href="{{url_for('index')}}">检验单</a><a href="{{url_for('inspection_new')}}">新建</a>{% if me.role=='admin' %}<a href="{{url_for('users')}}">用户</a>{% endif %}<form method="post" action="{{url_for('logout')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="link">退出 · {{me.username}}</button></form></nav>{% endif %}</header><main>{% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
