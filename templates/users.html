{% extends 'base.html' %}{% block content %}<div class="heading"><h1>用户管理</h1></div><form class="card userform" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>用户名<input name="username" required></label><label>初始密码（至少 8 位）<input type="password" name="password" minlength="8" required></label><label>角色<select name="role"><option value="inspector">检验员</option><option value="admin">管理员</option></select></label><button class="primary">创建用户</button></form><div class="card tablewrap"><table><thead><tr><th>用户名</th><th>角色</th><th>状态</th><th></th></tr></thead><tbody>{% for u in users %}<tr><td>{{u.username}}</td><td>{{u.role}}</td><td>{{'启用' if u.active else '禁用'}}</td><td><form method="post" action="{{url_for('user_toggle',uid=u.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button {{'disabled' if u.id==me.id}}>{{'禁用' if u.active else '启用'}}</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
